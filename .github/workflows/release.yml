name: Sürüm

# Dosya adları sürüm numarası içermez; böylece README'deki ve indirme sayfasındaki
# https://github.com/<sahip>/<depo>/releases/latest/download/<dosya> bağlantıları her zaman en yeni sürümü indirir.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  testler:
    uses: ./.github/workflows/test.yml

  paket:
    needs: testler
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (arm64)
            dosya: OptikSinav-Mac-AppleSilicon
          - os: macos-15-intel      # Intel (x86_64); etiket GitHub tarafında değişirse güncelleyin
            dosya: OptikSinav-Mac-Intel
          - os: windows-latest
            dosya: OptikSinav-Windows
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gelistirme]"
      - name: Paketle
        run: pyinstaller --noconfirm optik_sinav.spec

      - name: macOS disk görüntüsü
        if: runner.os == 'macOS'
        run: |
          codesign -s - --force --deep "dist/Optik Sinav.app" || true
          mkdir -p dmg && cp -R "dist/Optik Sinav.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Optik Sinav" -srcfolder dmg -ov -format UDZO "${{ matrix.dosya }}.dmg"

      - name: Windows taşınabilir arşiv
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\OptikSinav -DestinationPath "${{ matrix.dosya }}-Tasinabilir.zip"

      - name: Windows kurulum dosyası (Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $surum = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSurum=$surum paketleme\kurulum.iss
          Copy-Item "dist\OptikSinav-$surum-windows-kurulum.exe" "${{ matrix.dosya }}-Kurulum.exe"

      - name: Sürüm sayfasına ekle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OptikSinav-Mac-*.dmg
            OptikSinav-Windows-*.zip
            OptikSinav-Windows-Kurulum.exe
          fail_on_unmatched_files: false

  tarayici:
    needs: testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tek dosyalık tarayıcı sürümünü derle
        run: |
          python tools/web_derle.py
          cp web/dist/OptikSinav.html OptikSinav.html
      - name: Sürüm sayfasına ekle
        uses: softprops/action-gh-release@v2
        with:
          files: OptikSinav.html
